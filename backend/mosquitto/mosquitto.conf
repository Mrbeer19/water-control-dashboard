# mosquitto — broker ของโรงงาน (on-premise ไม่มีออกอินเทอร์เน็ต)

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ★ เก็บ session + ข้อความ QoS 1 ค้างส่งลงดิสก์
#   broker รีสตาร์ท/ingest หลุดสั้น ๆ ข้อมูลยังตามมาครบ (สถานการณ์ S8)
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
persistent_client_expiration 1d
max_queued_messages 20000

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
