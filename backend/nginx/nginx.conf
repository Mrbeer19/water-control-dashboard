# จุดเข้าเดียวของหน้าจอ: /api → FastAPI · อย่างอื่น → frontend ที่ build แล้ว

server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ★ resolver + ตัวแปร: ให้ nginx ขึ้นได้แม้ api ยังไม่ขึ้น
  #   ถ้าเขียน proxy_pass http://api:8000 ตรง ๆ nginx จะตายตอนสตาร์ทเพราะหาชื่อ host ไม่เจอ
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  location /api/stream {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri.html $uri/ /index.html;
  }
}
