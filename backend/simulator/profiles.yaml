scenarios:
  # S13 รั่วกลางคืน — น้ำหายหลังปั๊มแต่ก่อนมิเตอร์โซน (มิเตอร์โซนจึงไม่เห็น)
  #   กลางคืนถัง 1 เกือบเต็ม น้ำเข้าจากประปาจึงน้อย รั่วเห็นเป็น % ชัด (เฟส 6 เกณฑ์ข้อ 2)
  night_leak: {zone: zone-7, lpm: 11.4, from_hour: 22, to_hour: 5, tanks: {tank-1: 94}}
  # S14 ปั๊มเสื่อม — ใบพัดสึก กินไฟเพิ่มที่อัตราไหลเท่าเดิม
  pump_degrading: {pump: pump-1, power_factor: 1.35}
  # เฟส 6 เกณฑ์ข้อ 1 — บ่อสำรองพร่องต่ำกว่าจุดเริ่มเติม (90%) วาล์วเติมบ่อเปิดทันที น้ำผ่านมิเตอร์หลักแต่ยังไม่ถูกใช้
  pond_fill: {tanks: {tank-3: 89}}
